name: Build OfflineSkinOG

on:
  workflow_dispatch:
  push:
    paths:
      - 'OfflineSkinOG-v2-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: unzip -q OfflineSkinOG-v2-source.zip

      - name: Build mod
        run: |
          cd OfflineSkinOG-v2
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineSkinOG-JAR
          path: OfflineSkinOG-v2/build/libs/*.jar
